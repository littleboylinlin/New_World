<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f6ef">
    <meta name="description" content="在浏览器本地整理自己的小说和准备续写、仿写的原作。">
    <title>New World · 小说管理器</title>
    <link rel="icon" href="./book.svg" type="image/svg+xml">
  </head>
  <body>
    <a class="skip-link" href="#main">跳到正文</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="#/" aria-label="New World 书库首页">
          <img src="./book.svg" width="36" height="36" alt="">
          <span>New World <small>小说管理器</small></span>
        </a>
        <div class="header-actions">
          <span class="local-label"><span aria-hidden="true"></span>本地保存</span>
          <button type="button" id="update-help" class="button button-quiet button-small" aria-haspopup="dialog" aria-controls="update-help-dialog">帮助与更新</button>
        </div>
      </div>
    </header>
    <section id="update-banner" class="shell update-banner" aria-label="版本更新提示" hidden></section>
    <main id="main" class="shell main-content" tabindex="-1"></main>
    <footer class="shell site-footer"><span>New World <span id="app-version" class="version"></span></span><span>小说与原件保存在当前浏览器</span></footer>
    <noscript>请启用 JavaScript 以使用本地书库。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
