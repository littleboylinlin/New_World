<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#16130f">
    <meta name="description" content="A local library for novels and continuations.">
    <title>New World</title>
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="./app-icon.png" type="image/png" sizes="256x256">
    <script src="./appearance.js"></script>
  </head>
  <body>
    <script src="./intro.js"></script>
    <a class="skip-link" href="#main" data-i18n="header.skip"></a>
    <header class="site-header">
      <div class="shell header-inner">
        <button disabled id="drawer-toggle" class="button button-small" type="button" aria-controls="app-sidebar" aria-expanded="false" data-i18n-label="navigation.openMenu"></button>
        <a class="brand" href="#/" data-i18n-label="header.home">
          <img src="./icons/app-dark.svg" width="36" height="36" alt="">
          <span class="brand-name">New World</span>
        </a>
        <div class="header-actions">
          <span class="local-label"><span aria-hidden="true"></span><span data-i18n="header.local"></span></span>
        </div>
      </div>
    </header>
    <div class="workspace">
      <aside id="app-sidebar" class="app-sidebar">
        <div class="sidebar-top">
          <img src="./icons/app-light.svg" data-brand-icon data-light="./icons/app-light.svg" data-dark="./icons/app-dark.svg" width="32" height="32" alt="">
          <span class="brand-name">New World</span>
          <button disabled id="sidebar-toggle" class="sidebar-toggle" type="button" aria-controls="app-nav"></button>
        </div>
        <nav id="app-nav" data-i18n-label="navigation.main"></nav>
      </aside>
      <div id="drawer-backdrop" hidden></div>
      <div class="app-column">
        <div id="page" class="page">
          <section id="update-banner" class="shell update-banner" aria-label="版本更新提示" hidden></section>
          <main id="main" class="shell main-content" tabindex="-1"></main>
        </div>
        <footer class="site-footer">
          <div class="shell footer-inner">
            <div class="footer-meta">
              <span>New World <span id="app-version" class="version"></span></span>
              <p id="storage-location" class="storage-location"></p>
            </div>
          </div>
        </footer>
      </div>
    </div>
    <noscript>Please enable JavaScript to use New World.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
