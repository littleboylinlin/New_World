<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-en="Network notice — New World">网络提示 — New World</title>
  <meta name="description" content="当前网络可能无法稳定访问 GitHub，请切换网络节点后再访问。" data-en="Your network may not reach GitHub reliably. Please switch to another network node and visit again.">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="{{ICON_DATA}}" type="image/png">
  <style>{{STYLE}}</style>
  <script>{{LANG_SCRIPT}}</script>
</head>
<body>
  <main class="shell notice">
    <section class="notice-card">
      <div class="stripe" aria-hidden="true"></div>
      <img src="{{ICON_DATA}}" width="56" height="56" alt="New World">
      <h1><span data-l="zh">网络提示</span><span data-l="en" lang="en">Network notice</span></h1>
      <p><span data-l="zh">当前网络可能无法稳定访问 GitHub，请切换网络节点后再访问。</span><span data-l="en" lang="en">Your current network may not reach GitHub reliably. Please switch to another network node, then visit again.</span></p>
      <button class="chip" type="button" data-lang-toggle><span data-l="zh" lang="en">English</span><span data-l="en" lang="zh-CN">中文</span></button>
    </section>
  </main>
</body>
</html>
