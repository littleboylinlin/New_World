name: Bug 反馈 / Bug report
description: 报告 New World 的问题。 / Report a problem in New World.
title: "[Bug 反馈 / Bug] "
body:
  - type: input
    id: version
    attributes:
      label: 版本号 / Version
      placeholder: vX.Y.Z
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 平台 / Platform
      description: Windows / macOS / Linux / 网页 (Web) / 手机浏览器 (Mobile browser)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 从打开应用开始，按顺序写下操作。 / List the actions in order, starting from opening the app.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果 / Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual result
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图（可选） / Screenshots (optional)
      description: 可粘贴或拖入已遮盖隐私信息的截图。 / Paste or drop screenshots with private information redacted.
    validations:
      required: false
