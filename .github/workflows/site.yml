name: Website

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  # Checks publishes releases with GITHUB_TOKEN, which does not start release-triggered workflows.
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: 'true'

  # A version of the full site, web app included, at a Version URL for review. Production is untouched.
  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: website-preview-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Build the web app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npm run build
      - name: Build the site
        working-directory: site
        env:
          APP_DIST: ${{ github.workspace }}/dist
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm run build
      - name: Upload a preview version
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Applies preview_urls from wrangler.jsonc; routes and the live version stay as they are.
          npx wrangler triggers deploy
          npx wrangler versions upload --preview-alias "pr-$PR_NUMBER" --message "PR #$PR_NUMBER" | tee upload.log
          {
            echo '### Preview'
            grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' upload.log | sort -u | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.repository == 'littleboylinlin/New_World' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: website-deploy
    steps:
      - uses: actions/checkout@v6
      - name: Skip when the site already has the latest release
        id: release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          deployed=$(curl -fsS https://writenewworld.com/latest.json | jq -r .tag || true)
          echo "Latest $latest, deployed ${deployed:-none}"
          if [[ "$latest" == "$deployed" ]]; then echo 'skip=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v6
        if: steps.release.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Build the web app
        if: steps.release.outputs.skip != 'true'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npm run build
      - name: Build the site
        if: steps.release.outputs.skip != 'true'
        working-directory: site
        env:
          APP_DIST: ${{ github.workspace }}/dist
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm run build
      - name: Deploy to Cloudflare
        if: steps.release.outputs.skip != 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Check the live release
        if: steps.release.outputs.skip != 'true'
        working-directory: site
        run: |
          expected=$(jq -r .tag dist/latest.json)
          live=''
          # About five minutes in total. DNS goes through Cloudflare's resolver so a lookup the
          # runner cached before a new custom domain existed does not keep failing.
          for attempt in $(seq 1 20); do
            live=$(curl -fsS --max-time 10 --doh-url https://cloudflare-dns.com/dns-query \
              "https://writenewworld.com/latest.json?t=$GITHUB_RUN_ID-$attempt" 2>/dev/null | jq -r .tag 2>/dev/null || true)
            if [[ "$live" == "$expected" ]]; then echo "Live: $live"; exit 0; fi
            echo "Attempt $attempt: ${live:-not reachable yet}"
            sleep 15
          done
          echo "writenewworld.com serves ${live:-nothing}, expected $expected"
          exit 1
