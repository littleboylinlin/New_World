name: Website

on:
  push:
    branches: [main]
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  release:
    types: [published]
  # Checks publishes releases with GITHUB_TOKEN, which does not start release-triggered workflows.
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: 'true'

  deploy:
    if: github.repository == 'littleboylinlin/New_World' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: website-deploy
    steps:
      - uses: actions/checkout@v6
      - name: Skip when the site already has the latest release
        id: release
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          deployed=$(curl -fsS https://writenewworld.com/latest.json | jq -r .tag || true)
          echo "Latest $latest, deployed ${deployed:-none}"
          if [[ "$latest" == "$deployed" ]]; then echo 'skip=true' >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v6
        if: steps.release.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Build the web app
        if: steps.release.outputs.skip != 'true'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          npm run build
      - name: Build the site
        if: steps.release.outputs.skip != 'true'
        working-directory: site
        env:
          APP_DIST: ${{ github.workspace }}/dist
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm run build
      - name: Deploy to Cloudflare
        if: steps.release.outputs.skip != 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Check the live release
        if: steps.release.outputs.skip != 'true'
        working-directory: site
        run: |
          expected=$(jq -r .tag dist/latest.json)
          for attempt in 1 2 3 4 5 6; do
            live=$(curl -fsS "https://writenewworld.com/latest.json?t=$GITHUB_RUN_ID-$attempt" | jq -r .tag || true)
            if [[ "$live" == "$expected" ]]; then echo "Live: $live"; exit 0; fi
            sleep 20
          done
          echo "writenewworld.com serves ${live:-nothing}, expected $expected"
          exit 1
