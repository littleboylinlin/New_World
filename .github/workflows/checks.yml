name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: '正式发行版标签，例如 v0.9.0；平台由 release.json 指定'
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: browser-checks
          path: |
            test-results/**/home-*.png
            test-results/**/editor-*.png
            test-results/**/export-*
          retention-days: 7

  windows-tests:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Read release targets
        id: plan
        run: node desktop/release-plan.mjs --github-output
      - run: npm ci
      - run: npm run build:windows
      - name: Test the installed Windows app
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $installer = "New-World-Setup-$version-x64.exe"
          $env:NEW_WORLD_INSTALLER = (Resolve-Path "dist-windows/$installer").Path
          $env:NEW_WORLD_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'New World Custom Install'
          powershell.exe -NoProfile -File tests/desktop/installer.ps1 -Installer $env:NEW_WORLD_INSTALLER -Directory $env:NEW_WORLD_INSTALL_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-checks
          path: |
            test-results/desktop/**/windows-*.png
            test-results/desktop/**/error-context.md
          retention-days: 7
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request' && steps.plan.outputs.windows == 'true'
        with:
          name: windows-x64
          path: |
            dist-windows/New-World-Setup-*-x64.exe
            dist-windows/New-World-lang-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  macos-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      MACOS_ARCH: ${{ matrix.arch }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Read release targets
        id: plan
        run: node desktop/release-plan.mjs --github-output
      - run: npm ci
      - run: npm run build:macos
      - name: Install the DMG and test the native Mac app
        run: npm run test:macos
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macos-checks-${{ matrix.arch }}
          path: |
            test-results/macos/**/macos-*.png
            test-results/macos/**/error-context.md
          retention-days: 7
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request' && steps.plan.outputs.macos == 'true'
        with:
          name: macos-installer-${{ matrix.arch }}
          path: |
            dist-macos/New-World-*-macos-${{ matrix.arch }}.dmg
            dist-macos/New-World-lang-*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    if: github.repository == 'littleboylinlin/New_World' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [browser-tests, windows-tests, macos-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Select an explicitly requested release
        id: release
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(node -p 'require("./package.json").version')
          node desktop/release-plan.mjs --github-output
          tag="v$version"
          notes="docs/releases/$tag.md"
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            if [[ "$REQUESTED_TAG" != "$tag" || ! -f "$notes" ]]; then
              echo 'The requested tag must match package.json and have release notes.'
              exit 1
            fi
          elif ! git diff --diff-filter=A --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- "$notes" | grep -Fxq "$notes"; then
            echo 'No new release notes for this version.'
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        if: steps.release.outputs.tag != '' && steps.release.outputs.windows == 'true'
        with:
          name: windows-x64
          path: ${{ runner.temp }}/desktop-release
      - uses: actions/download-artifact@v7
        if: steps.release.outputs.tag != '' && steps.release.outputs.macos == 'true'
        with:
          pattern: macos-installer-*
          merge-multiple: true
          path: ${{ runner.temp }}/desktop-release
      - name: Verify artifacts and publish
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          node scripts/build-language-packs.mjs
          node desktop/release-plan.mjs --verify-artifacts "$RUNNER_TEMP/desktop-release"
          bash desktop/publish-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/desktop-release"
